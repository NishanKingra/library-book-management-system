<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Transactions')}"></head><body><div th:replace="~{fragments :: sidebar('transactions')}"></div><main class="main"><header class="topbar"><div><div class="eyebrow">CIRCULATION</div><h1>Transactions</h1></div><a class="button primary" href="/issues/new">＋ Issue a book</a></header><div th:replace="~{fragments :: alerts}"></div><section class="panel"><div class="panel-head"><div><h3>Borrowing activity</h3><p>Issue records, due dates and returns.</p></div><form class="search" action="/transactions"><select name="status"><option value="">All transactions</option><option value="ACTIVE" th:selected="${filter=='ACTIVE'}">Active</option><option value="RETURNED" th:selected="${filter=='RETURNED'}">Returned</option></select><button class="button outline">Filter</button></form></div><div class="table-wrap"><table><thead><tr><th>BOOK</th><th>STUDENT</th><th>ISSUED</th><th>DUE DATE</th><th>RETURNED</th><th>STATUS</th><th></th></tr></thead><tbody><tr th:each="i:${issues}"><td class="primary-cell" th:text="${i.title}"></td><td><span th:text="${i.studentName}"></span><small class="sub-cell" th:text="${i.email}"></small></td><td th:text="${i.issueDate}"></td><td th:text="${i.dueDate}"></td><td th:text="${i.returnDate==null?'—':i.returnDate}"></td><td><span class="badge" th:classappend="${i.status=='ACTIVE'}?' badge-blue':' badge-green'" th:text="${i.status}"></span></td><td><form th:if="${i.status=='ACTIVE'}" method="post" th:action="@{/transactions/{id}/return(id=${i.id})}"><button class="button small primary">Return</button></form></td></tr><tr th:if="${#lists.isEmpty(issues)}"><td colspan="7" class="empty">No transactions match this filter.</td></tr></tbody></table></div></section></main></body></html>
