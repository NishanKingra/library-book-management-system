<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Student details')}"></head><body><div th:replace="~{fragments :: sidebar('students')}"></div><main class="main"><header class="topbar"><div><div class="eyebrow">MEMBERS</div><h1 th:text="${student.id==null?'Register student':'Edit student'}">Student details</h1></div><a class="button outline" href="/students">← Back to students</a></header><div th:replace="~{fragments :: alerts}"></div><section class="panel form-panel"><form action="/students/save" method="post"><input type="hidden" name="id" th:value="${student.id}"><label>Full name<input name="fullName" required maxlength="160" th:value="${student.fullName}" placeholder="Student name"></label><label>University email<input type="email" name="email" required maxlength="190" th:value="${student.email}" placeholder="name@university.edu"></label><label>Department<input name="department" required maxlength="120" th:value="${student.department}" placeholder="Department"></label><div class="form-actions"><a class="button outline" href="/students">Cancel</a><button class="button primary">Save student</button></div></form></section></main></body></html>
