<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Issue a book')}"></head><body><div th:replace="~{fragments :: sidebar('issues')}"></div><main class="main"><header class="topbar"><div><div class="eyebrow">CIRCULATION</div><h1>Issue a book</h1></div></header><div th:replace="~{fragments :: alerts}"></div><section class="form-intro"><div class="feature-mark">↗</div><div><h3>Start a new loan</h3><p>Students may borrow up to 3 books for 14 days. Due dates are set automatically.</p></div></section><section class="panel form-panel"><form action="/issues" method="post"><label>Select student<select name="studentId" required><option value="">Choose a registered student</option><option th:each="s:${students}" th:value="${s.id}" th:text="${s.fullName+' · '+s.department}"></option></select></label><label>Select available book<select name="bookId" required><option value="">Choose a book</option><option th:each="b:${books}" th:if="${b.availableCopies>0}" th:value="${b.id}" th:text="${b.title+' · '+b.author+' ('+b.availableCopies+' available)'}"></option></select></label><div class="notice">Borrowing period: <strong>14 days</strong><span>Overdue fine: ₹5 per day</span></div><div class="form-actions"><a class="button outline" href="/transactions">Cancel</a><button class="button primary">Confirm issue</button></div></form><p class="empty" th:if="${#lists.isEmpty(students)}">Register a student before issuing books.</p></section></main></body></html>
