<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Students')}"></head><body><div th:replace="~{fragments :: sidebar('students')}"></div><main class="main"><header class="topbar"><div><div class="eyebrow">MEMBERS</div><h1>Students</h1></div><a class="button primary" href="/students/new">＋ Register student</a></header><div th:replace="~{fragments :: alerts}"></div><section class="panel"><div class="panel-head"><div><h3>Registered students</h3><p>Manage student details and borrowing history.</p></div><form class="search" action="/students"><input name="q" th:value="${q}" placeholder="Search name, email or department"><button class="button outline">Search</button></form></div><div class="table-wrap"><table><thead><tr><th>STUDENT</th><th>EMAIL</th><th>DEPARTMENT</th><th></th></tr></thead><tbody><tr th:each="s:${students}"><td class="primary-cell" th:text="${s.fullName}"></td><td th:text="${s.email}"></td><td th:text="${s.department}"></td><td class="actions"><a class="text-link" th:href="@{/students/{id}/history(id=${s.id})}">History</a><a class="text-link" th:href="@{/students/{id}/edit(id=${s.id})}">Edit</a><form method="post" th:action="@{/students/{id}/delete(id=${s.id})}" onsubmit="return confirm('Delete this student record? Students with loan history are retained.')"><button class="link-danger">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(students)}"><td colspan="4" class="empty">No students found.</td></tr></tbody></table></div></section></main></body></html>
