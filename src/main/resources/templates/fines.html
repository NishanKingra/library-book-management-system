<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Fine desk')}"></head><body><div th:replace="~{fragments :: sidebar('fines')}"></div><main class="main"><header class="topbar"><div><div class="eyebrow">ACCOUNTS</div><h1>Fine desk</h1></div></header><div th:replace="~{fragments :: alerts}"></div><section class="panel"><div class="panel-head"><div><h3>Fine register</h3><p>₹5 per overdue day · fines are calculated when a book is returned.</p></div></div><div class="table-wrap"><table><thead><tr><th>STUDENT</th><th>BOOK</th><th>OVERDUE</th><th>FINE AMOUNT</th><th>STATUS</th><th></th></tr></thead><tbody><tr th:each="f:${fines}"><td class="primary-cell" th:text="${f.studentName}"></td><td th:text="${f.title}"></td><td th:text="${f.overdueDays+' days'}"></td><td class="primary-cell" th:text="${'₹'+#numbers.formatDecimal(f.amount,1,2)}"></td><td><span class="badge" th:classappend="${f.paid}?' badge-green':' badge-red'" th:text="${f.paid?'PAID':'PENDING'}"></span></td><td><form th:if="${!f.paid}" method="post" th:action="@{/fines/{id}/pay(id=${f.id})}"><button class="button small outline">Mark paid</button></form></td></tr><tr th:if="${#lists.isEmpty(fines)}"><td colspan="6" class="empty">No fine records yet.</td></tr></tbody></table></div></section></main></body></html>
