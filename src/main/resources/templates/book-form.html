<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Book details')}"></head><body><div th:replace="~{fragments :: sidebar('books')}"></div><main class="main"><header class="topbar"><div><div class="eyebrow">COLLECTION</div><h1 th:text="${book.id==null?'Add a book':'Edit book'}">Book details</h1></div><a class="button outline" href="/books">← Back to catalogue</a></header><div th:replace="~{fragments :: alerts}"></div><section class="panel form-panel"><form action="/books/save" method="post"><input type="hidden" name="id" th:value="${book.id}"><label>Book title<input name="title" required maxlength="200" th:value="${book.title}" placeholder="e.g. The Pragmatic Programmer"></label><div class="form-row"><label>Author<input name="author" required maxlength="160" th:value="${book.author}" placeholder="Author name"></label><label>Category<input name="category" required maxlength="100" th:value="${book.category}" placeholder="e.g. Computer Science"></label></div><label>Total copies<input name="totalCopies" type="number" min="0" required th:value="${book.id==null?0:book.totalCopies}"></label><p class="hint">Copies currently on loan are preserved automatically.</p><div class="form-actions"><a class="button outline" href="/books">Cancel</a><button class="button primary">Save book</button></div></form></section></main></body></html>
