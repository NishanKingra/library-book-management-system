<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Book catalogue')}"></head><body><div th:replace="~{fragments :: sidebar('books')}"></div><main class="main"><header class="topbar"><div><div class="eyebrow">COLLECTION</div><h1>Book catalogue</h1></div><a class="button primary" href="/books/new">＋ Add a book</a></header><div th:replace="~{fragments :: alerts}"></div><section class="panel"><div class="panel-head"><div><h3>Your books</h3><p>Search, update or archive titles in your collection.</p></div><form class="search" action="/books"><input name="q" th:value="${q}" placeholder="Search title, author or category"><button class="button outline">Search</button></form></div><div class="table-wrap"><table><thead><tr><th>TITLE</th><th>AUTHOR</th><th>CATEGORY</th><th>COPIES</th><th>AVAILABILITY</th><th></th></tr></thead><tbody><tr th:each="b:${books}"><td class="primary-cell" th:text="${b.title}"></td><td th:text="${b.author}"></td><td th:text="${b.category}"></td><td><span th:text="${b.availableCopies}"></span> / <span th:text="${b.totalCopies}"></span></td><td><span class="badge" th:classappend="${b.availableCopies>0}?' badge-green':' badge-red'" th:text="${b.availableCopies>0?'Available':'On loan'}"></span></td><td class="actions"><a class="text-link" th:href="@{/books/{id}/edit(id=${b.id})}">Edit</a><form method="post" th:action="@{/books/{id}/delete(id=${b.id})}" onsubmit="return confirm('Archive this title?')"><button class="link-danger">Archive</button></form></td></tr><tr th:if="${#lists.isEmpty(books)}"><td colspan="6" class="empty">No books found.</td></tr></tbody></table></div></section></main></body></html>
