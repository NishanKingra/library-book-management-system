<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Student history')}"></head><body><div th:replace="~{fragments :: sidebar('students')}"></div><main class="main"><header class="topbar"><div><div class="eyebrow">MEMBER HISTORY</div><h1 th:text="${student.fullName}"></h1></div><a class="button outline" href="/students">← Students</a></header><section class="form-intro"><div class="avatar large" th:text="${#strings.substring(student.fullName,0,1)}">S</div><div><h3 th:text="${student.department}"></h3><p th:text="${student.email}"></p></div></section><section class="panel"><div class="panel-head"><div><h3>Borrowing history</h3><p>All issue and return records for this student.</p></div></div><div class="table-wrap"><table><thead><tr><th>BOOK</th><th>ISSUED</th><th>DUE</th><th>RETURNED</th><th>STATUS</th></tr></thead><tbody><tr th:each="i:${history}"><td th:text="${i.title}"></td><td th:text="${i.issueDate}"></td><td th:text="${i.dueDate}"></td><td th:text="${i.returnDate==null?'—':i.returnDate}"></td><td th:text="${i.status}"></td></tr><tr th:if="${#lists.isEmpty(history)}"><td colspan="5" class="empty">No borrowing history.</td></tr></tbody></table></div></section><section class="panel report-panel"><div class="panel-head"><div><h3>Fine history</h3><p>Outstanding and paid charges for this student.</p></div></div><div class="table-wrap"><table><thead><tr><th>BOOK</th><th>OVERDUE DAYS</th><th>AMOUNT</th><th>STATUS</th></tr></thead><tbody><tr th:each="f:${fines}"><td th:text="${f.title}"></td><td th:text="${f.overdueDays}"></td><td th:text="${'₹'+#numbers.formatDecimal(f.amount,1,2)}"></td><td th:text="${f.paid?'Paid':'Pending'}"></td></tr><tr th:if="${#lists.isEmpty(fines)}"><td colspan="4" class="empty">No fine records.</td></tr></tbody></table></div></section></main></body></html>
